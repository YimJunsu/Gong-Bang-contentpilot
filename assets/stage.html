<!doctype html>
<html><head><meta charset="utf-8">
<!-- 숏폼 무대. video.mjs가 setup(장면)을 한 번 부르고, 프레임마다 renderAt(t)로 시간을 넘기며 캡처한다.
     모든 움직임은 t의 순수 함수다 — CSS 애니메이션/타이머를 쓰지 않으므로 몇 번을 찍어도 같은 프레임이 나온다. -->
<style>
  html, body { margin:0; width:1080px; height:1920px; overflow:hidden; background:#0d1220; }
  #stage { position:absolute; inset:0; overflow:hidden; }
  #bg { position:absolute; inset:-80px; background-size:cover; background-position:center; filter:blur(38px) brightness(.55) saturate(1.2); }
  #bgcolor { position:absolute; inset:0; background:radial-gradient(circle at 50% 40%, #2b3a6b, #0d1220 70%); }
  /* 미디어 상자는 마스크: 줌·흔들기를 해도 상자 밖으로 넘치지 않는다 (캡컷의 '마스크' + 키프레임 줌) */
  #frame { position:absolute; left:20px; top:600px; width:1040px; height:960px; display:flex; align-items:center; justify-content:center; }
  #box { position:relative; overflow:hidden; border-radius:22px; box-shadow:0 18px 50px rgba(0,0,0,.45); line-height:0; }
  #media { max-width:1040px; max-height:960px; display:block; will-change:transform; }
  #flash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; }

  .title { position:absolute; top:110px; left:40px; right:40px; text-align:center; font-family:T; line-height:1.18; }
  .title .line { font-size:118px; color:#fff; -webkit-text-stroke:22px #000; paint-order:stroke fill; letter-spacing:-2px; }
  .title .line:nth-of-type(2) { color:#ffe600; }
  .badge { display:inline-block; margin-bottom:20px; padding:8px 30px; border-radius:40px; background:#ff3b5c; color:#fff; font:52px B; border:5px solid #000; }

  #cap { position:absolute; left:60px; right:60px; top:1590px; height:230px; display:flex; align-items:center; justify-content:center; text-align:center; }
  .cap { font-family:B; font-size:76px; line-height:1.28; color:#fff; -webkit-text-stroke:14px #000; paint-order:stroke fill; word-break:keep-all; }
  .cap .w { display:inline-block; margin:0 .12em; transform-origin:50% 80%; }
  .cap .now { color:#ffe600; }
  .cap.angry { font-family:T; font-size:94px; color:#ff4a3d; -webkit-text-stroke:18px #000; }
  .cap.angry .now { color:#fff; }
  .cap.whisper { font-size:64px; color:#cfe0ff; -webkit-text-stroke:10px rgba(0,0,0,.85); }
  .cap.whisper::before { content:'(소곤소곤)'; display:block; font-size:42px; color:#9fb6dd; margin-bottom:4px; }
  .cap.emphasis, .cap.excited { font-size:84px; }
  /* 이글이글: 그림자 색·위치를 t로 흔든다(renderAt) */
  .fire { color:#fff4b8 !important; -webkit-text-stroke:0 !important; }

  .sticker { position:absolute; left:50%; top:1250px; padding:18px 40px 20px; background:#fff; border:9px solid #000; border-radius:22px;
             font-family:T; font-size:96px; line-height:1.1; color:#ff2d55; text-align:center; white-space:nowrap; box-shadow:12px 12px 0 #000; }
  .sticker::before, .sticker::after { content:'★'; color:#ffcc00; -webkit-text-stroke:5px #000; paint-order:stroke fill; margin:0 10px; }
  .sticker em { font-style:normal; color:#000; background:#ffe600; padding:0 10px; border-radius:10px; }
  .emoji { position:absolute; width:190px; height:190px; }

  #bar { position:absolute; left:0; bottom:0; height:14px; background:#ffe600; }
  #track { position:absolute; left:0; right:0; bottom:0; height:14px; background:rgba(0,0,0,.45); }
</style></head>
<body><div id="stage">
  <div id="bgcolor"></div><div id="bg"></div>
  <div id="frame"><div id="box"></div></div>
  <div class="title" id="title"></div>
  <div id="stickers"></div>
  <div id="cap"></div>
  <div id="track"></div><div id="bar"></div>
  <div id="flash"></div>
</div>
<script>
const $ = (s) => document.querySelector(s);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const ease = {
  out: (p) => 1 - Math.pow(1 - p, 3),
  back: (p) => { const c = 1.9; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); },
  elastic: (p) => (p <= 0 ? 0 : p >= 1 ? 1 : Math.pow(2, -10 * p) * Math.sin((p * 10 - 0.75) * (2 * Math.PI) / 3) + 1),
  bounce: (p) => { const n = 7.5625, d = 2.75; if (p < 1 / d) return n * p * p; if (p < 2 / d) return n * (p -= 1.5 / d) * p + 0.75; if (p < 2.5 / d) return n * (p -= 2.25 / d) * p + 0.9375; return n * (p -= 2.625 / d) * p + 0.984375; }
};
const fireShadow = (t, k = 1) => {
  const f = Math.sin(t * 23) * 0.5 + Math.sin(t * 37 + 1) * 0.5;
  return [`0 0 ${6 * k}px #fff`, `0 ${-(5 + 2 * f) * k}px ${14 * k}px #ffd000`, `${2 * f * k}px ${-(11 + 3 * f) * k}px ${26 * k}px #ff8a00`,
    `${-2 * f * k}px ${-(19 + 4 * f) * k}px ${40 * k}px #ff2a00`, `0 0 ${3 * k}px #000`, `0 ${4 * k}px ${4 * k}px #000`].join(',');
};
const marked = (text) => esc(text).replace(/\*(.+?)\*/g, '<em class="fire">$1</em>');

let S = null, media = null;
window.setup = async (scene) => {
  S = scene;
  for (const [family, url] of Object.entries(scene.fonts)) { const f = new FontFace(family, `url("${url}")`); await f.load(); document.fonts.add(f); }
  $('#title').innerHTML = scene.title?.lines?.length
    ? `${scene.title.badge ? `<span class="badge">${esc(scene.title.badge)}</span>` : ''}${scene.title.lines.map((l) => `<div class="line">${marked(l)}</div>`).join('')}` : '';
  if (scene.kind === 'image' || scene.kind === 'video') {
    media = document.createElement(scene.kind === 'image' ? 'img' : 'video');
    media.id = 'media'; media.src = scene.media;
    if (scene.kind === 'video') { media.muted = true; media.preload = 'auto'; await new Promise((ok) => { media.onloadeddata = ok; media.onerror = ok; }); }
    else await media.decode().catch(() => {});
    $('#box').appendChild(media);
    $('#bg').style.backgroundImage = scene.kind === 'image' ? `url("${scene.media}")` : '';
    $('#media').style.transformOrigin = `${scene.focus[0]}% ${scene.focus[1]}%`;
  }
  $('#stickers').innerHTML = [
    scene.stamp ? `<div class="sticker" id="stamp">${esc(scene.stamp.text).replace(/\*(.+?)\*/g, '<em>$1</em>')}</div>` : '',
    ...scene.emojis.map((e, i) => `<img class="emoji" id="emo${i}" src="${e.src}">`)
  ].join('');
  await document.fonts.ready;
};

// 미디어 움직임: 장면 내내 천천히 확대(켄번스) + 문장 이벤트(펀치 줌인·줌아웃·팬·흔들기·통통)
function mediaTransform(t) {
  let zoom = 1, prevZoom = 1, panX = 0, prevPan = 0, extra = '', jx = 0, jy = 0, pulse = 0;
  for (const ev of S.events) {
    if (t < ev.at) break;
    const p = clamp((t - ev.at) / 0.32);
    if (ev.type === 'punch') { prevZoom = zoom; zoom = prevZoom + (1.32 - prevZoom) * ease.back(p); }
    else if (ev.type === 'zoomout') { prevZoom = zoom; zoom = prevZoom + (1 - prevZoom) * ease.out(p); }
    else if (ev.type === 'pan') { prevPan = panX; panX = prevPan + ((ev.dir || 1) * 70 - prevPan) * ease.out(p); }
    else if (ev.type === 'shake' && t - ev.at < 0.6) { const k = 1 - (t - ev.at) / 0.6; jx += Math.sin(t * 90) * 22 * k; jy += Math.cos(t * 70) * 14 * k; }
    else if (ev.type === 'bounce' && t - ev.at < 0.45) pulse += Math.sin(((t - ev.at) / 0.45) * Math.PI) * 0.09;
  }
  const kb = 1 + 0.05 * (t / S.seconds);
  // 등장(PPT 애니메이션처럼)
  const e = clamp(t / 0.42);
  if (S.enter === 'slide') extra = `translateX(${(1 - ease.out(e)) * 1100}px)`;
  else if (S.enter === 'pop') extra = `scale(${0.2 + 0.8 * ease.back(e)})`;
  else if (S.enter === 'drop') extra = `translateY(${-(1 - ease.bounce(e)) * 1300}px)`;
  else if (S.enter === 'flip') extra = `perspective(1400px) rotateY(${(1 - ease.out(e)) * 95}deg)`;
  else if (S.enter === 'spin') extra = `rotate(${(1 - ease.back(e)) * -200}deg) scale(${0.2 + 0.8 * ease.out(e)})`;
  else if (S.enter === 'zoomblur') extra = `scale(${1 + 0.7 * (1 - ease.out(e))})`;
  else if (S.enter === 'glitch' && t < 0.45) extra = `translate(${Math.sin(t * 190) * 26}px, ${Math.cos(t * 150) * 8}px)`;
  return `${extra} translate(${panX + jx}px, ${jy}px) scale(${kb * zoom + pulse})`;
}

window.renderAt = async (t) => {
  const T = S.seconds;
  if (media) {
    media.style.transform = mediaTransform(t);
    media.style.clipPath = S.enter === 'wipe' ? `circle(${ease.out(clamp(t / 0.45)) * 80}% at 50% 50%)` : '';
    // 캡컷 '줌 블러'·'글리치' 전환: 흐림 / 빨강·청록 색 갈라짐(RGB 분리)
    const g = S.enter === 'glitch' ? 1 - clamp(t / 0.45) : 0;
    const blur = S.enter === 'zoomblur' ? (1 - ease.out(clamp(t / 0.42))) * 22 : 0;
    media.style.filter = [blur ? `blur(${blur}px)` : '', g ? `drop-shadow(${-18 * g}px 0 0 rgba(255,0,60,.75)) drop-shadow(${18 * g}px 0 0 rgba(0,240,255,.75))` : ''].join(' ');
    if (S.kind === 'video' && media.duration) {
      const want = t % media.duration;
      if (Math.abs(media.currentTime - want) > 0.001) { media.currentTime = want; await new Promise((ok) => { media.onseeked = ok; setTimeout(ok, 500); }); }
    }
  }
  $('#flash').style.opacity = S.index > 1 ? String(clamp(0.7 - t / 0.16 * 0.7)) : '0';
  // 제목 강조는 내내 이글이글
  document.querySelectorAll('.title .fire').forEach((el) => { el.style.textShadow = fireShadow(t, 1.4); });

  // 자막: 말하는 순서대로 단어가 튀어나오고, 지금 읽는 단어는 노란색
  const c = S.captions.find((x) => t >= x.start && t < x.end) || null;
  const box = $('#cap');
  if (!c) box.innerHTML = '';
  else {
    if (box.dataset.id !== String(c.id)) {
      box.dataset.id = c.id;
      box.innerHTML = `<div class="cap ${c.tone}">${c.words.map((w, i) => `<span class="w${w.em ? ' fire' : ''}" data-i="${i}">${esc(w.text)}</span>`).join(' ')}</div>`;
    }
    const capEl = box.firstChild;
    const shake = c.tone === 'angry' ? `translate(${Math.sin(t * 81) * 9}px, ${Math.cos(t * 63) * 5}px)` : '';
    capEl.style.transform = `${shake} scale(${1 + 0.1 * (1 - clamp((t - c.start) / 0.12))})`;
    box.querySelectorAll('.w').forEach((el) => {
      const w = c.words[el.dataset.i];
      const p = clamp((t - w.start) / 0.14);
      // 자막 전체는 처음부터 보이고, 지금 읽는 단어만 노랗게 튀어 오른다 (캡컷 자동 자막 '단어 강조')
      const now = t >= w.start && t < w.end + 0.05;
      el.style.transform = `scale(${now ? 1.12 + 0.2 * (1 - ease.out(p)) : 1})`;
      el.classList.toggle('now', now && !w.em);
      if (w.em) el.style.textShadow = fireShadow(t + w.start, 1.1);
    });
  }

  // 스티커 도장: 튀어나와(elastic) 살랑살랑
  const st = $('#stamp');
  if (st) {
    const p = clamp((t - S.stamp.at) / 0.55);
    st.style.opacity = t >= S.stamp.at ? '1' : '0';
    st.style.transform = `translate(-50%, -50%) rotate(${-6 + Math.sin(t * 5) * 2}deg) scale(${t >= S.stamp.at ? 0.1 + 0.9 * ease.elastic(p) : 0})`;
  }
  S.emojis.forEach((e, i) => {
    const el = $(`#emo${i}`);
    const on = t >= e.at && t < e.end;
    const p = clamp((t - e.at) / 0.4);
    el.style.opacity = on ? '1' : '0';
    el.style.left = `${e.x}px`; el.style.top = `${e.y}px`;
    el.style.transform = `rotate(${Math.sin(t * 6 + i) * 10}deg) scale(${on ? ease.back(p) : 0}) translateY(${Math.sin(t * 4) * 10}px)`;
  });

  $('#bar').style.width = `${clamp((S.offset + t) / S.total) * 100}%`;
};
</script></body></html>
