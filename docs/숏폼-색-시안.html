<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>숏폼 색 시안</title>
<style>
  @font-face { font-family: G; src: url("../assets/fonts/GmarketSansTTFBold.ttf"); }
  @font-face { font-family: BH; src: url("../assets/fonts/BlackHanSans-Regular.ttf"); }
  @font-face { font-family: PR; src: url("../assets/fonts/Pretendard-ExtraBold.otf"); }
  * { box-sizing:border-box; }
  body { margin:0; background:#f4f3ef; color:#17171c; font-family:PR, system-ui, sans-serif; padding:32px 16px 60px; }
  h1 { font-size:26px; margin:0 0 6px; }
  .lead { color:#6b6b75; margin:0 0 26px; font-size:15px; line-height:1.6; max-width:900px; }
  h2 { font-size:19px; margin:30px 0 14px; }
  .row { display:flex; flex-wrap:wrap; gap:18px; }
  .card { width:216px; }
  .card h3 { font-size:14px; margin:8px 0 2px; }
  .card p { margin:0; font-size:12.5px; color:#6b6b75; line-height:1.5; }
  .wrap { width:216px; height:384px; border-radius:12px; overflow:hidden; box-shadow:0 6px 20px rgba(0,0,0,.18); }
  .f { width:1080px; height:1920px; transform:scale(.2); transform-origin:0 0; position:relative; overflow:hidden; background:#111; }
  .vid { position:absolute; left:0; right:0; background:
     radial-gradient(circle at 30% 35%, #8fb7d9 0, transparent 40%),
     radial-gradient(circle at 70% 60%, #d9a38f 0, transparent 45%),
     linear-gradient(160deg,#41506b,#22283a); }
  .abs { position:absolute; }

  /* ① B 응원봉 테두리 — --k 응원봉 색, --k2 보조 */
  .c1 .vid { inset:0; }
  .c1 .fade { left:0; right:0; top:0; height:620px; background:linear-gradient(var(--dark) 0, color-mix(in srgb, var(--dark) 85%, transparent) 45%, transparent); }
  .c1 .src { left:0; right:0; top:90px; text-align:center; font:28px PR; color:var(--k2); letter-spacing:4px; }
  .c1 .t { left:0; right:0; top:150px; text-align:center; font:80px G; color:#fff; letter-spacing:-2px; line-height:1.3; }
  .c1 .t em { font-style:normal; display:inline-block; padding:2px 30px 8px; border:6px solid var(--k); border-radius:99px; box-shadow:0 0 24px var(--k), inset 0 0 18px color-mix(in srgb, var(--k) 60%, transparent); }
  .c1 .cap { left:120px; right:120px; bottom:240px; text-align:center; }
  .c1 .cap span { font:54px G; color:#fff; border-bottom:6px solid var(--k); padding:0 8px 8px; text-shadow:0 2px 10px rgba(0,0,0,.8); }

  /* ② B 도장 — --band 띠, --ink 제목, --sub 작은 글, --stamp 도장, --card 자막칸, --cardInk, --cardShadow */
  .c2 { background:var(--band); }
  .c2 .band { position:absolute; top:0; left:0; right:0; height:370px; background:var(--band); padding:70px 70px 0; }
  .c2 .t { font:92px BH; color:var(--ink); letter-spacing:-3px; line-height:1.12; }
  .c2 .t small { display:block; font:34px PR; color:var(--sub); letter-spacing:0; margin-bottom:12px; }
  .c2 .stamp { right:60px; top:70px; width:220px; height:220px; border:10px solid var(--stamp); border-radius:50%; color:var(--stamp); font:54px BH; display:grid; place-items:center; transform:rotate(14deg); }
  .c2 .vid { top:370px; bottom:0; }
  .c2 .ksub { left:0; right:0; bottom:250px; text-align:center; }
  .c2 .ksub span { font:52px G; color:var(--cardInk); background:var(--card); padding:14px 32px 18px; border-radius:20px; box-shadow:0 8px 0 var(--cardShadow); }
  .c2 .pop { left:90px; top:560px; font:64px BH; color:var(--stamp); -webkit-text-stroke:10px #fff; paint-order:stroke fill; transform:rotate(-8deg); }
</style>
</head>
<body>
<h1>색 시안 — ①B 응원봉 테두리 · ②B 도장</h1>
<p class="lead">모양은 그대로 두고 색만 바꿔 봤습니다. 마음에 드는 번호를 골라 주세요(예: ①-3, ②-2). 섞어서 "①-2 테두리에 ①-4 배경"처럼 말해도 됩니다.</p>

<h2>① 연예인 핫 — B 응원봉 테두리</h2>
<div class="row" id="r1"></div>

<h2>② 해외 꿀잼 — B 도장</h2>
<div class="row" id="r2"></div>

<script>
const c1 = [
  ['1', '보라 (지금)', '보라 빛 + 검정', { k:'#bb66ff', k2:'#d9c2ff', dark:'#000' }],
  ['2', '민트 네온', '차가운 민트, 밤 무대', { k:'#3dffd0', k2:'#aef7e6', dark:'#02110e' }],
  ['3', '코랄 핑크', '따뜻하고 밝은 분홍', { k:'#ff5c8a', k2:'#ffc2d4', dark:'#1a0610' }],
  ['4', '골드', '시상식·레전드 무대 느낌', { k:'#ffcc33', k2:'#ffe9a8', dark:'#100c00' }],
  ['5', '아이스 블루', '깔끔한 하늘색', { k:'#5ab8ff', k2:'#cbe6ff', dark:'#020a14' }],
  ['6', '자동: 그룹 색', '그 그룹 응원봉·공식 색을 AI가 고름(예시는 라임)', { k:'#b8ff3d', k2:'#e3ffb0', dark:'#0a1200' }],
];
const c2 = [
  ['1', '흰 + 빨강 (지금)', '흰 띠, 빨간 도장', { band:'#ffffff', ink:'#111', sub:'#888', stamp:'#e52d2d', card:'#fff', cardInk:'#111', cardShadow:'#111' }],
  ['2', '검정 + 노랑', '검은 띠, 노란 도장·노란 자막칸', { band:'#111111', ink:'#fff', sub:'#9a9a9a', stamp:'#ffd400', card:'#ffd400', cardInk:'#111', cardShadow:'#000' }],
  ['3', '크림 + 초록', '크림 띠, 진초록 도장', { band:'#f6efe0', ink:'#1d2b1f', sub:'#8a8170', stamp:'#1f9d55', card:'#f6efe0', cardInk:'#1d2b1f', cardShadow:'#1d2b1f' }],
  ['4', '하늘 + 빨강', '하늘색 띠, 빨간 도장', { band:'#bfe3ff', ink:'#0d2340', sub:'#4f6d8f', stamp:'#ff3b30', card:'#fff', cardInk:'#0d2340', cardShadow:'#0d2340' }],
  ['5', '노랑 + 검정', '노란 띠, 검은 도장', { band:'#ffe14d', ink:'#111', sub:'#6b5a00', stamp:'#111111', card:'#111', cardInk:'#ffe14d', cardShadow:'#ffe14d' }],
  ['6', '남색 + 주황', '짙은 남색 띠, 주황 도장', { band:'#1b2140', ink:'#fff', sub:'#8f97c2', stamp:'#ff7a2f', card:'#fff', cardInk:'#1b2140', cardShadow:'#ff7a2f' }],
];
const vars = (o) => Object.entries(o).map(([k, v]) => `--${k}:${v}`).join(';');
document.getElementById('r1').innerHTML = c1.map(([n, name, d, o]) => `<div class="card"><div class="wrap"><div class="f c1" style="${vars(o)}">
  <div class="vid"></div><div class="abs fade"></div><div class="abs src">OFFICIAL · LIVE</div>
  <div class="abs t">이 표정 보고<br><em>안나</em> 입덕함</div><div class="abs cap"><span>엔딩 요정 미쳤다</span></div>
  </div></div><h3>①-${n} ${name}</h3><p>${d}</p></div>`).join('');
document.getElementById('r2').innerHTML = c2.map(([n, name, d, o]) => `<div class="card"><div class="wrap"><div class="f c2" style="${vars(o)}">
  <div class="band"><div class="t"><small>미국 · 원작자 영상</small>드럼 배틀<br>끝난 줄 알았지</div></div>
  <div class="abs stamp">실화</div><div class="vid"></div><div class="abs pop">ㅋㅋㅋㅋㅋ</div>
  <div class="abs ksub"><span>"잠깐, 지금 발로 치는 거야?"</span></div>
  </div></div><h3>②-${n} ${name}</h3><p>${d}</p></div>`).join('');
</script>
</body>
</html>
